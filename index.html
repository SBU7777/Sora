<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SBU Command Deck</title>
  <style>
    :root {
      --bg: #0b1528;
      --card-bg: #132238;
      --cyan: #00d2ff;
      --cyan-bright: #38bdf8;
      --yellow: #facc15;
      --yellow-text: #000;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #1e3a5f;
      --accent-orange: #ff7b00;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background: radial-gradient(circle at top, #162a45 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
    }

    /* Top Brand Header */
    .header-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: baseline;
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .header-title {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      color: var(--cyan);
      text-transform: uppercase;
    }
    .header-tagline {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--cyan-bright);
      text-transform: uppercase;
      opacity: 0.85;
    }

    /* Main Center Console */
    .console-card {
      width: 100%;
      max-width: 900px;
      background: rgba(19, 34, 56, 0.85);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Big Center Orb */
    .orb-stage {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .orb-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid var(--accent-orange);
      box-shadow: 0 0 25px rgba(255, 123, 0, 0.5), inset 0 0 20px rgba(0, 210, 255, 0.3);
      animation: pulse-ring 3s infinite ease-in-out;
    }
    .orb-core {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: var(--accent-orange);
      box-shadow: 0 0 30px var(--accent-orange);
      transition: all 0.3s ease;
    }

    .orb-stage.listening .orb-ring { border-color: #10b981; box-shadow: 0 0 30px #10b981; }
    .orb-stage.listening .orb-core { background: #10b981; box-shadow: 0 0 35px #10b981; }
    .orb-stage.speaking .orb-ring { border-color: var(--cyan); box-shadow: 0 0 35px var(--cyan); }
    .orb-stage.speaking .orb-core { background: var(--cyan); box-shadow: 0 0 40px var(--cyan); }

    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.04); opacity: 1; }
    }

    .status-label {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: var(--cyan);
      text-transform: uppercase;
      margin-bottom: 1.75rem;
    }

    /* Control Buttons Row */
    .button-group {
      display: flex;
      gap: 1rem;
      width: 100%;
      max-width: 720px;
      justify-content: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .btn-action {
      flex: 1;
      min-width: 140px;
      padding: 0.9rem 1.25rem;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      text-align: center;
    }
    .btn-live {
      background: var(--yellow);
      color: var(--yellow-text);
    }
    .btn-live.active {
      box-shadow: 0 0 15px rgba(250, 204, 21, 0.6);
    }
    .btn-talk {
      background: #0284c7;
      color: #fff;
    }
    .btn-talk:hover { background: #0369a1; }
    .btn-talk.active { background: #10b981; }
    
    .btn-dark {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      color: #fff;
    }
    .btn-dark:hover { border-color: var(--cyan); }

    .wake-hint {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      font-style: italic;
    }

    /* Input Bar */
    .input-row {
      display: flex;
      gap: 0.75rem;
      width: 100%;
      max-width: 720px;
      margin-bottom: 1.5rem;
    }
    .input-box {
      flex: 1;
      background: rgba(10, 18, 30, 0.8);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem 1.25rem;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    .input-box:focus { border-color: var(--cyan); }
    .btn-send {
      background: var(--cyan);
      color: #0b1528;
      font-weight: 800;
      font-size: 1rem;
      border: none;
      padding: 0.9rem 2rem;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-send:hover { opacity: 0.9; }

    /* Output Console */
    .transcript-box {
      width: 100%;
      max-width: 720px;
      background: rgba(10, 18, 30, 0.6);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      max-height: 250px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .msg-tag {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }
    .msg-content {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #f1f5f9;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="header-title">SBU Command</div>
    <div class="header-tagline">Breaking the silence. Building brotherhood. Standing together.</div>
  </div>

  <div class="console-card">
    <div id="orbStage" class="orb-stage">
      <div class="orb-ring"></div>
      <div class="orb-core"></div>
    </div>

    <div id="statusLabel" class="status-label">Ready</div>

    <div class="button-group">
      <button id="liveBtn" class="btn-action btn-live" onclick="toggleLiveMode()">Live mode on</button>
      <button id="holdBtn" class="btn-action btn-talk" onmousedown="startHold()" onmouseup="stopHold()" ontouchstart="startHold()" ontouchend="stopHold()">Hold to talk</button>
      <button id="voiceBtn" class="btn-action btn-dark" onclick="toggleVoice()">Voice on</button>
      <button id="stopBtn" class="btn-action btn-dark" onclick="stopAll()">Stop</button>
    </div>

    <div class="wake-hint">Say "Sora" or hold button to speak</div>

    <div class="input-row">
      <input type="text" id="commandInput" class="input-box" placeholder="Or type a command and press Enter" onkeydown="if(event.key==='Enter') sendCommand()" />
      <button class="btn-send" onclick="sendCommand()">Send</button>
    </div>

    <div id="transcriptBox" class="transcript-box">
      <div>
        <div class="msg-tag">Sora</div>
        <div class="msg-content">Welcome to SBU Command. Platform connected and standing by.</div>
      </div>
    </div>
  </div>

  <script>
    let isLive = false;
    let voiceEnabled = true;
    let recognition = null;
    let messageHistory = [];

    function setStatus(text, orbClass) {
      document.getElementById('statusLabel').innerText = text;
      const orb = document.getElementById('orbStage');
      orb.className = 'orb-stage ' + (orbClass || '');
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      document.getElementById('voiceBtn').innerText = voiceEnabled ? "Voice on" : "Voice off";
    }

    function stopAll() {
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      if (recognition) recognition.stop();
      isLive = false;
      document.getElementById('liveBtn').classList.remove('active');
      setStatus("Stopped", "");
    }

    function speakText(text, callback) {
      if (voiceEnabled && 'speechSynthesis' in window) {
        setStatus("Speaking", "speaking");
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.onend = () => {
          setStatus("Ready", "");
          if (callback) callback();
        };
        speechSynthesis.speak(utterance);
      } else {
        setStatus("Ready", "");
        if (callback) callback();
      }
    }

    async function sendCommand(customText) {
      const input = document.getElementById('commandInput');
      const text = customText !== undefined ? customText.trim() : input.value.trim();
      if (!text) return;

      appendMessage("You", text);
      input.value = "";
      messageHistory.push({ role: "user", content: text });

      setStatus("Thinking...", "");

      try {
        const res = await fetch("/.netlify/functions/brain", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system: "You are Sora, AI co-host and command interface for Struggling Brothers United. Provide punchy, authentic, supportive responses for men overcoming struggles. Do not use em dashes, semicolons, or hashtags.",
            messages: messageHistory
          })
        });

        const data = await res.json();
        const reply = data.content?.[0]?.text || "Response received.";

        appendMessage("Sora", reply);
        messageHistory.push({ role: "assistant", content: reply });

        speakText(reply, () => {
          if (isLive) startListening();
        });
      } catch (err) {
        appendMessage("System", "Error communicating with Gemini: " + err.message);
        setStatus("Ready", "");
        if (isLive) startListening();
      }
    }

    function appendMessage(sender, text) {
      const box = document.getElementById('transcriptBox');
      const row = document.createElement('div');
      row.innerHTML = `<div class="msg-tag">${sender}</div><div class="msg-content">${text.replace(/\n/g, '<br>')}</div>`;
      box.appendChild(row);
      box.scrollTop = box.scrollHeight;
    }

    /* Speech Recognition Engine */
    function getSpeechEngine() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return null;
      const rec = new SR();
      rec.continuous = false;
      rec.interimResults = false;
      return rec;
    }

    function toggleLiveMode() {
      isLive = !isLive;
      const btn = document.getElementById('liveBtn');
      if (isLive) {
        btn.classList.add('active');
        speakText("Live mode active. I am listening.", () => {
          startListening();
        });
      } else {
        btn.classList.remove('active');
        if (recognition) recognition.stop();
        speakText("Live mode off.");
      }
    }

    function handleLiveSpeech(spokenText) {
      const lower = spokenText.toLowerCase().trim();
      
      // Check if user spoke the wake word Sora / Sarah
      if (lower.includes("sora") || lower.includes("sarah") || lower.includes("zora")) {
        // Remove the wake word trigger from the phrase
        let cleaned = lower.replace(/^(hey\s+|hi\s+|hello\s+)?(sora|sarah|zora)[\s,.]*/i, '').trim();

        if (cleaned.length === 0) {
          // You just called her name
          appendMessage("You", spokenText);
          const acknowledgment = "I'm right here. What do you need?";
          appendMessage("Sora", acknowledgment);
          speakText(acknowledgment, () => {
            if (isLive) startListening();
          });
        } else {
          // You called her name and gave a command
          sendCommand(spokenText);
        }
      } else {
        // Wake word wasn't heard, keep listening silently
        if (isLive) {
          startListening();
        }
      }
    }

    function startListening() {
      if (!recognition) recognition = getSpeechEngine();
      if (!recognition) return alert("Speech recognition not supported in this browser.");

      recognition.onstart = () => setStatus("Listening...", "listening");
      recognition.onresult = (e) => {
        const spoken = e.results[0][0].transcript;
        handleLiveSpeech(spoken);
      };
      recognition.onerror = () => {
        setStatus("Ready", "");
        if (isLive && !speechSynthesis.speaking) {
          setTimeout(() => startListening(), 500);
        }
      };
      recognition.onend = () => {
        if (isLive && !speechSynthesis.speaking) {
          try { recognition.start(); } catch(e){}
        }
      };
      try { recognition.start(); } catch(e){}
    }

    function startHold() {
      document.getElementById('holdBtn').classList.add('active');
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      if (!recognition) recognition = getSpeechEngine();
      if (!recognition) return;

      recognition.onstart = () => setStatus("Listening...", "listening");
      recognition.onresult = (e) => {
        const spoken = e.results[0][0].transcript;
        document.getElementById('commandInput').value = spoken;
        sendCommand(spoken);
      };
      try { recognition.start(); } catch(e){}
    }

    function stopHold() {
      document.getElementById('holdBtn').classList.remove('active');
      if (recognition) recognition.stop();
    }
  </script>
</body>
</html>
