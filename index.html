<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SBU Command | Sora AI</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --accent: #d97706; /* warm amber */
      --accent-soft: rgba(217, 119, 6, 0.15);
      --agent-producer: #f59e0b;
      --agent-scribe: #10b981;
      --agent-scout: #3b82f6;
      --agent-field: #8b5cf6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

    /* Left Sidebar: Agents & Controls */
    #sidebar {
      width: 280px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1rem;
      gap: 1.5rem;
    }
    .brand { font-size: 1.25rem; font-weight: 700; color: var(--text-bright); display: flex; align-items: center; gap: 0.5rem; }
    .brand span { color: var(--accent); }
    .agents-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .agent-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      font-weight: 600;
      transition: all 0.2s;
    }
    .agent-btn:hover, .agent-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--text-bright);
    }
    .toggle-group {
      margin-top: auto;
      padding: 1rem;
      background: rgba(0,0,0,0.2);
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Main Deck */
    #deck {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    #header {
      height: 60px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      background: var(--panel);
    }
    .orb-container { display: flex; align-items: center; gap: 0.75rem; }
    .orb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #4b5563;
      transition: all 0.3s ease;
    }
    .orb.listening { background: #10b981; box-shadow: 0 0 12px #10b981; }
    .orb.thinking { background: #f59e0b; box-shadow: 0 0 12px #f59e0b; }
    .orb.speaking { background: #3b82f6; box-shadow: 0 0 12px #3b82f6; }

    #transcript {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .msg { max-width: 80%; padding: 1rem; border-radius: 8px; line-height: 1.5; font-size: 0.95rem; }
    .msg.user { align-self: flex-end; background: #1e293b; color: var(--text-bright); }
    .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }

    /* Input Footer */
    #input-area {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      gap: 0.75rem;
    }
    #userInput {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
    }
    #userInput:focus { border-color: var(--accent); }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="brand">SBU <span>Command</span></div>
    
    <div class="agents-list">
      <div style="font-size: 0.75rem; color: #8b949e; text-transform: uppercase; margin-bottom: 0.25rem;">Active Agent</div>
      <button class="agent-btn active" onclick="setAgent('Producer')">🎙️ Producer (OMI Script)</button>
      <button class="agent-btn" onclick="setAgent('Scribe')">✍️ Scribe (Copy/Devo)</button>
      <button class="agent-btn" onclick="setAgent('Scout')">🔍 Scout (Research)</button>
      <button class="agent-btn" onclick="setAgent('Field')">⚡ Field (Exec Plans)</button>
    </div>

    <div class="toggle-group">
      <span style="font-size: 0.85rem; font-weight: 600;">Live Mode</span>
      <input type="checkbox" id="liveToggle" onchange="toggleLiveMode()" />
    </div>
  </div>

  <div id="deck">
    <div id="header">
      <div class="orb-container">
        <div id="orb" class="orb"></div>
        <span id="statusText" style="font-size: 0.85rem; font-weight: 600;">Sora Idle</span>
      </div>
      <div id="agentBadge" style="font-size: 0.85rem; color: var(--accent); font-weight: 600;">Agent: Producer</div>
    </div>

    <div id="transcript">
      <div class="msg assistant">
        Welcome to SBU Command Deck. Sora is online and ready. How are we building brotherhood today?
      </div>
    </div>

    <div id="input-area">
      <input type="text" id="userInput" placeholder="Ask Sora anything or give an agent task..." onkeydown="handleKey(event)" />
      <button class="btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    let activeAgent = "Producer";
    let messageHistory = [];

    const agentPrompts = {
      Producer: "You are Sora acting as Producer for Struggling Brothers United. You format all podcast concepts, show notes, and teasers using clean, punchy outlines. Maintain a warm, grounded, authentic tone for men aged 18 to 60. Avoid corporate jargon, em dashes, semicolons, and hashtags.",
      Scribe: "You are Sora acting as Scribe. You write reflections, devotionals, newsletter copy, and teasers. Maintain a natural, human, active voice that avoids em dashes, semicolons, and generic intros.",
      Scout: "You are Sora acting as Scout. Provide high-density research summaries, audience insights, and source synthesis for brotherhood, men's identity, and life struggles.",
      Field: "You are Sora acting as Field. Break down multi-step operational plans, production schedules, and project checklists with clear itemized steps."
    };

    function setAgent(agent) {
      activeAgent = agent;
      document.querySelectorAll('.agent-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.includes(agent));
      });
      document.getElementById('agentBadge').innerText = `Agent: ${agent}`;
      appendMessage("assistant", `Switched to **${agent}** mode. What's the directive?`);
    }

    function setOrbState(state, label) {
      const orb = document.getElementById('orb');
      orb.className = `orb ${state}`;
      document.getElementById('statusText').innerText = label;
    }

    function appendMessage(role, text) {
      const transcript = document.getElementById('transcript');
      const msg = document.createElement('div');
      msg.className = `msg ${role}`;
      msg.innerHTML = text.replace(/\n/g, '<br>');
      transcript.appendChild(msg);
      transcript.scrollTop = transcript.scrollHeight;
    }

    async function callBrain(systemPrompt, userMessages) {
      try {
        const res = await fetch("/.netlify/functions/brain", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system: systemPrompt,
            messages: userMessages
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || `Server responded with ${res.status}`);
        }

        const data = await res.json();
        return data;
      } catch (err) {
        console.error("Brain call error:", err);
        throw err;
      }
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      appendMessage("user", text);
      input.value = "";
      messageHistory.push({ role: "user", content: text });

      setOrbState("thinking", "Sora Thinking...");

      try {
        const system = agentPrompts[activeAgent] || agentPrompts.Producer;
        const response = await callBrain(system, messageHistory);
        const reply = response.content?.[0]?.text || "No response received.";

        setOrbState("speaking", "Sora Speaking");
        appendMessage("assistant", reply);
        messageHistory.push({ role: "assistant", content: reply });

        // Text-to-speech if speech synthesis is supported
        if ('speechSynthesis' in window) {
          const utterance = new SpeechSynthesisUtterance(reply);
          utterance.onend = () => setOrbState("", "Sora Idle");
          speechSynthesis.speak(utterance);
        } else {
          setOrbState("", "Sora Idle");
        }
      } catch (err) {
        appendMessage("assistant", `⚠️ Connection Error: ${err.message}`);
        setOrbState("", "Sora Error");
      }
    }

    function handleKey(e) {
      if (e.key === "Enter") sendMessage();
    }

    function toggleLiveMode() {
      const enabled = document.getElementById('liveToggle').checked;
      if (enabled) {
        startVoiceRecognition();
      }
    }

    function startVoiceRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech Recognition not supported on this browser.");
        document.getElementById('liveToggle').checked = false;
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => setOrbState("listening", "Listening...");
      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('userInput').value = transcript;
        sendMessage();
      };
      recognition.onerror = () => setOrbState("", "Sora Idle");
      recognition.onend = () => {
        if (document.getElementById('liveToggle').checked) {
          recognition.start();
        }
      };

      recognition.start();
    }
  </script>
</body>
</html>
